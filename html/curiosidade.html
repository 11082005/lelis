<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Para a garota mais incrível do mundo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Open+Sans:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      background: linear-gradient(135deg, #ffe6f0, #fff0f5);
      color: #4b2e2e;
      overflow-x: hidden;
      position: relative;
    }

    /* Corações animados */
    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      transform: rotate(45deg);
      animation: float 8s linear infinite;
      opacity: 0.6;
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(45deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) rotate(45deg);
        opacity: 0;
      }
    }

    header {
      background: linear-gradient(to right, #ff6b9f, #ff85a2);
      color: white;
      text-align: center;
      padding: 4rem 2rem;
      font-family: 'Pacifico', cursive;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      animation: fadeInDown 1s ease;
      position: relative;
      z-index: 1;
    }

    header h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    header p {
      font-size: 1.2rem;
    }

    section {
      padding: 3rem 1rem;
      max-width: 1000px;
      margin: auto;
      animation: fadeIn 2s ease;
      position: relative;
      z-index: 1;
    }

    section h2 {
      text-align: center;
      font-family: 'Pacifico', cursive;
      color: #d6336c;
      margin-bottom: 2rem;
      font-size: 2.5rem;
    }

    section p {
      line-height: 1.8;
      font-size: 1.1rem;
      text-align: justify;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 2rem;
      padding-top: 2rem;
    }

    .galeria img {
      width: 100%;
      border-radius: 2rem;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      transition: transform 0.4s, box-shadow 0.4s;
    }

    .galeria img:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 24px rgba(0,0,0,0.3);
    }

    .musicas {
      text-align: center;
      padding-top: 2rem;
    }

    .musicas a {
      display: inline-block;
      margin: 0.8rem;
      padding: 0.8rem 1.5rem;
      background: #ffcce0;
      border-radius: 2rem;
      text-decoration: none;
      color: #a80055;
      font-weight: bold;
      font-size: 1.1rem;
      transition: background 0.4s, transform 0.3s;
    }

    .musicas a:hover {
      background: #ffa0c2;
      transform: translateY(-3px);
    }

    footer {
      text-align: center;
      padding: 2rem;
      background: #ffe4ec;
      font-family: 'Pacifico', cursive;
      color: #8c3a5d;
      font-size: 1.5rem;
      position: relative;
      z-index: 1;
    }

    /* Botão de música */
    #audio-control {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #ff85a2;
      color: white;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 10;
      transition: background 0.3s;
    }

    #audio-control:hover {
      background: #ff4d79;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-40px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  </head>
  <body>
    <!-- Corações animados -->
    <div class="hearts"></div>
  
  
    <header>
      <h1>Curiosidades sobre a leleee ❤️</h1>
      <p>Um pouquinho sobre vc</p>
    </header>
  
    <section>
      <h2>Curiosidades</h2>
      <p></p>
    </section>
    
      <script>
        // Corações subindo
        function createHeart() {
          const heart = document.createElement('div');
          heart.className = 'heart';
          heart.style.left = Math.random() * 100 + 'vw';
          heart.style.animationDuration = (5 + Math.random() * 5) + 's';
          document.querySelector('.hearts').appendChild(heart);
    
          setTimeout(() => {
            heart.remove();
          }, 10000);
        }
    
        setInterval(createHeart, 300);
    
        // Controle do áudio
        const audio = document.getElementById('background-music');
        const btn = document.getElementById('audio-control');
    
        btn.addEventListener('click', () => {
          if (audio.paused) {
            audio.play();
            btn.innerHTML = '⏸️'; // Ícone de pausa
          } else {
            audio.pause();
            btn.innerHTML = '▶️'; // Ícone de play
          }
        });
      </script>
    </body>
    </html>
